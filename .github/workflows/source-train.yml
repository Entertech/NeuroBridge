name: Source version train

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        options: [plan, initialize, select, promote, prepare, review, release, merge, verify]
      version:
        description: "明确选择 major.minor.patch；不默认创建版本"
        type: string
        required: true
      requirements:
        description: "initialize/select：选定的需求分支，以逗号分隔"
        type: string
      promotion_pr:
        description: "prepare：已合并的 dev_B -> publish_B PR 编号"
        type: string
      candidate:
        description: "review：人工审核通过的完整候选 SHA"
        type: string
      plan_source:
        description: "plan：要预览的完整 SHA 或 origin/分支；留空使用当前工作流提交"
        type: string
      systems:
        description: "plan/release：可选，逗号分隔 windows-10、windows-11、kylin-v10；留空读取发布配置并自动判断受影响系统"
        type: string
  pull_request:
    types: [closed]
    branches: ['publish_*', master]

permissions:
  contents: read
  actions: read

concurrency:
  # Serialize mutations repository-wide. Read-only previews never queue with them.
  group: source-train-${{ github.repository }}${{ inputs.operation == 'plan' && format('-plan-{0}', github.run_id) || '' }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'plan'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preview version, packages, documents and train gates
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN_VERSION: ${{ inputs.version }}
          PLAN_SOURCE: ${{ inputs.plan_source || github.sha }}
          TRAIN_SYSTEMS: ${{ inputs.systems }}
        run: |
          python -m tools.source_train plan --version "$TRAIN_VERSION" --head "$PLAN_SOURCE" --systems "$TRAIN_SYSTEMS" --summary "$GITHUB_STEP_SUMMARY"

  source:
    if: (github.event_name == 'workflow_dispatch' && inputs.operation != 'plan') || (github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'dev_') || startsWith(github.head_ref, 'finalize_')))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      complete: ${{ steps.source.outputs.complete }}
      operation: ${{ steps.route.outputs.operation }}
      version: ${{ steps.route.outputs.version }}
      candidate: ${{ steps.source.outputs.candidate }}
      candidate_branch: ${{ steps.source.outputs.candidate_branch }}
      skip_release: ${{ steps.source.outputs.skip_release }}
      should_package: ${{ steps.source.outputs.should_package }}
      artifact_id: ${{ steps.source.outputs.artifact_id }}
      package_run_id: ${{ steps.source.outputs.package_run_id }}
      systems: ${{ steps.source.outputs.systems }}
      system_releases: ${{ steps.source.outputs.system_releases }}
      parallel_systems: ${{ steps.source.outputs.parallel_systems }}
      system_matrix: ${{ steps.source.outputs.system_matrix }}
      recovery_runs: ${{ steps.source.outputs.recovery_runs }}
      software_result: ${{ steps.source.outputs.software_result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure source commit identity
        run: |
          git config user.name 'NeuroBridge release automation'
          git config user.email 'release-automation@users.noreply.github.com'
      - name: Resolve the selected train operation
        id: route
        env:
          TRAIN_OPERATION: ${{ inputs.operation }}
          TRAIN_VERSION: ${{ inputs.version }}
          TRAIN_BASE: ${{ github.event.pull_request.base.ref }}
          TRAIN_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          import os
          from tools.source_train import numeric
          operation, version = os.environ['TRAIN_OPERATION'], os.environ['TRAIN_VERSION']
          if not operation:
              base, head = os.environ['TRAIN_BASE'], os.environ['TRAIN_HEAD']
              if base.startswith('publish_') and head.startswith('dev_') and base[8:] == head[4:]:
                  operation, version = 'prepare', base[8:]
              elif head.startswith('finalize_'):
                  operation, version = 'verify', head[9:]
              else:
                  raise SystemExit('Unexpected source promotion route')
          numeric(version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('operation='+operation+'\nversion='+version+'\n')
          PY
      - name: Run source orchestration
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN_RELEASE_IDENTITY: workflow
          TRAIN_APP_LOGIN: ${{ github.actor }}
          TRAIN_OPERATION: ${{ steps.route.outputs.operation }}
          TRAIN_VERSION: ${{ steps.route.outputs.version }}
          TRAIN_REQUIREMENTS: ${{ inputs.requirements }}
          TRAIN_PROMOTION: ${{ inputs.promotion_pr || github.event.pull_request.number }}
          TRAIN_CANDIDATE: ${{ inputs.candidate }}
          TRAIN_SYSTEMS: ${{ inputs.systems }}
        run: |
          args=("$TRAIN_OPERATION" --version "$TRAIN_VERSION" --execute)
          case "$TRAIN_OPERATION" in
            initialize|select) args+=(--requirements "$TRAIN_REQUIREMENTS") ;;
            prepare) args+=(--promotion "$TRAIN_PROMOTION") ;;
            review) args+=(--candidate "$TRAIN_CANDIDATE") ;;
            release) args=(begin-release --version "$TRAIN_VERSION" --systems "$TRAIN_SYSTEMS" --execute) ;;
          esac
          python -m tools.source_train "${args[@]}"
      - name: Continue the merged train explicitly
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          TRAIN_OPERATION: ${{ steps.route.outputs.operation }}
          TRAIN_VERSION: ${{ steps.route.outputs.version }}
          TRAIN_PROMOTION: ${{ github.event.pull_request.number }}
        with:
          script: |
            const operation = process.env.TRAIN_OPERATION;
            const inputs = { operation, version: process.env.TRAIN_VERSION };
            if (operation === 'prepare') inputs.promotion_pr = process.env.TRAIN_PROMOTION;
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'source-train.yml',
              ref: context.payload.repository.default_branch,
              inputs,
            });

  packages:
    # The reusable workflow cleans intermediate Artifacts with this token.
    # Called workflows cannot elevate the caller job's permissions.
    permissions:
      contents: write
      actions: write
    needs: [source]
    if: needs.source.outputs.operation == 'release' && needs.source.outputs.skip_release != 'true' && needs.source.outputs.should_package == 'true' && needs.source.outputs.parallel_systems != 'true'
    uses: ./.github/workflows/release.yml
    with:
      source_sha: ${{ needs.source.outputs.candidate }}
      source_branch: ${{ needs.source.outputs.candidate_branch }}
      source_train: true
      system_releases: ${{ needs.source.outputs.system_releases == 'true' }}
      systems: ${{ needs.source.outputs.systems }}
    secrets: inherit

  system-packages:
    permissions:
      contents: write
      actions: write
    needs: [source]
    if: needs.source.outputs.operation == 'release' && needs.source.outputs.skip_release != 'true' && needs.source.outputs.parallel_systems == 'true' && needs.source.outputs.software_result != 'success' && needs.source.outputs.complete != 'true'
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.source.outputs.system_matrix) }}
    uses: ./.github/workflows/release.yml
    with:
      source_sha: ${{ needs.source.outputs.candidate }}
      source_branch: ${{ needs.source.outputs.candidate_branch }}
      source_train: true
      system_releases: true
      publish_system: true
      systems: ${{ matrix.system }}
      recovery_runs: ${{ needs.source.outputs.recovery_runs }}
      train_version: ${{ needs.source.outputs.version }}
    secrets: inherit

  finish-systems:
    needs: [source, system-packages]
    if: ${{ !cancelled() && needs.source.result == 'success' && needs.source.outputs.operation == 'release' && needs.source.outputs.skip_release != 'true' && needs.source.outputs.parallel_systems == 'true' && needs.source.outputs.complete != 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    outputs:
      software_result: ${{ steps.finish.outputs.software_result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record public software releases
        id: finish
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN_RELEASE_IDENTITY: workflow
          TRAIN_APP_LOGIN: ${{ github.actor }}
          TRAIN_VERSION: ${{ needs.source.outputs.version }}
        run: |
          git config user.name 'NeuroBridge release automation'
          git config user.email 'release-automation@users.noreply.github.com'
          python -m tools.source_train finish-systems --version "$TRAIN_VERSION" --execute

  publish-delivery:
    needs: [source, finish-systems]
    if: ${{ !cancelled() && needs.source.result == 'success' && needs.source.outputs.operation == 'release' && needs.source.outputs.skip_release != 'true' && needs.source.outputs.parallel_systems == 'true' && (needs.finish-systems.outputs.software_result == 'success' || needs.source.outputs.software_result == 'success') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-ci.lock
      - name: Publish the verified delivery ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN_RELEASE_IDENTITY: workflow
          TRAIN_APP_LOGIN: ${{ github.actor }}
          TRAIN_VERSION: ${{ needs.source.outputs.version }}
        run: |
          python -m tools.source_train publish-delivery --version "$TRAIN_VERSION" --execute
          printf '## Delivery ZIP published\n\n`delivery/v%s`\n' "$TRAIN_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Record delivery publication failure
        if: failure()
        run: |
          echo '::warning::Delivery ZIP was not published. Retry the same version to use the recorded software Releases.'
          printf '## Delivery ZIP publication failed\n\nRetry the same version to use the recorded software Releases.\n' >> "$GITHUB_STEP_SUMMARY"

  finalize:
    needs: [source, packages]
    if: always() && needs.source.result == 'success' && needs.source.outputs.operation == 'release' && needs.source.outputs.skip_release != 'true' && needs.source.outputs.parallel_systems != 'true' && needs.source.outputs.complete != 'true' && (needs.packages.result == 'success' || needs.packages.result == 'skipped')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.packages.outputs.artifact_id || needs.source.outputs.artifact_id }}
          run-id: ${{ needs.source.outputs.package_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/source-train
      - name: Record verified Artifact, tag exact source, and open finalization PR
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN_RELEASE_IDENTITY: workflow
          TRAIN_APP_LOGIN: ${{ github.actor }}
          TRAIN_VERSION: ${{ needs.source.outputs.version }}
          TRAIN_ARTIFACT: ${{ needs.packages.outputs.artifact_id || needs.source.outputs.artifact_id }}
        run: |
          git config user.name 'NeuroBridge release automation'
          git config user.email 'release-automation@users.noreply.github.com'
          python -m tools.source_train record-artifact --version "$TRAIN_VERSION" --artifact-id "$TRAIN_ARTIFACT" --directory artifacts/source-train --execute
          python -m tools.source_train finalize --version "$TRAIN_VERSION" --directory artifacts/source-train --execute

  retain-failed-attempt:
    needs: [source, packages, finalize]
    if: always() && needs.source.result == 'success' && needs.source.outputs.operation == 'release' && needs.source.outputs.skip_release != 'true' && (needs.packages.result == 'failure' || needs.packages.result == 'cancelled' || needs.finalize.result == 'failure' || needs.finalize.result == 'cancelled')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Keep retry checkpoint and preserve every tagged candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN_RELEASE_IDENTITY: workflow
          TRAIN_APP_LOGIN: ${{ github.actor }}
          TRAIN_VERSION: ${{ needs.source.outputs.version }}
        run: |
          git config user.name 'NeuroBridge release automation'
          git config user.email 'release-automation@users.noreply.github.com'
          python -m tools.source_train fail --version "$TRAIN_VERSION" --execute
