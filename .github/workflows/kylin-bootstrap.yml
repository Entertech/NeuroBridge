name: Kylin bootstrap package

# Builds the Kylin bootstrap deb, the package that carries the gateway source
# and builds its own runtime when installed on Galaxy Kylin.  Nothing in it is
# compiled, so it builds on a plain Ubuntu runner with dpkg-deb; it does not
# need the self-hosted Kylin runner.  The deb is an Actions artifact, not a
# release asset: installing it is what produces the runtime, on the Kylin
# machine itself.
#
# Explicit manual diagnostic build only. Automatic Kylin packaging belongs to
# release.yml, called by Test only after a version advance and successful tests.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  deb:
    name: Build the Kylin bootstrap deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ runner.os == 'Windows' && '3.11.9' || '3.11.17' }}"
      - name: Check locked build host
        run: python tools/build_environment.py check-host
      - name: Install dpkg-deb
        run: python tools/build_environment.py deb
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: kylin-cache
        with:
          path: .runtime/kylin-bootstrap-inputs
          key: kylin-inputs-${{ hashFiles('config/kylin-bootstrap-inputs.toml') }}
      - name: Prepare missing locked dependency cache
        if: steps.kylin-cache.outputs.cache-hit != 'true'
        run: python tools/prepare-kylin-bootstrap-inputs.py --download
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.kylin-cache.outputs.cache-hit != 'true'
        with:
          path: .runtime/kylin-bootstrap-inputs
          key: kylin-inputs-${{ hashFiles('config/kylin-bootstrap-inputs.toml') }}
      - name: Verify locked dependency inputs
        run: python tools/prepare-kylin-bootstrap-inputs.py
      - name: Build the bootstrap deb
        run: python tools/build-kylin-bootstrap-package.py --format deb --output-dir artifacts
      - name: Record the package digest
        run: sha256sum artifacts/*.deb | tee artifacts/SHA256SUMS
      - name: Check the package carries its source and offline inputs
        run: |
          set -eu
          listing=$(dpkg-deb --contents artifacts/*.deb)
          for required in \
            ./usr/lib/neurobridge-bootstrap/platform.sh \
            ./usr/lib/neurobridge-bootstrap/kylin-bootstrap-inputs.toml \
            ./usr/lib/neurobridge-bootstrap/source/packaging/kylin/offline/Python-3.11.16.tar.xz \
            ./usr/lib/neurobridge-bootstrap/source/packaging/kylin/offline/cmake-3.31.6.tar.gz \
            ./usr/lib/neurobridge-bootstrap/source/wheelhouse/websockets-12.0-py3-none-any.whl \
            ./usr/lib/neurobridge-bootstrap/bootstrap-build.sh \
            ./usr/lib/neurobridge-bootstrap/bootstrap-install.sh \
            ./usr/lib/neurobridge-bootstrap/source/python-runtime/cpython-3.11.16+20260825-x86_64-unknown-linux-gnu-install_only.tar.gz \
            ./usr/lib/neurobridge-bootstrap/source/wheelhouse/pyserial-3.5-py2.py3-none-any.whl \
            ./usr/lib/neurobridge-bootstrap/source/linux/setup-kylin-algorithm.sh \
            ./usr/lib/neurobridge-bootstrap/source/packaging/kylin/python-launcher.sh \
            ./usr/lib/neurobridge-bootstrap/source/mac/algorithm_bridge/CMakeLists.txt \
            ./usr/lib/neurobridge-bootstrap/source/mac/algorithm_bridge/affective_bridge.cpp \
            ./usr/lib/neurobridge-bootstrap/source/packaging/kylin/offline/cmake-3.31.6-linux-x86_64.tar.gz \
            ./usr/lib/neurobridge-bootstrap/source/packaging/kylin/offline/eigen-3.3.7.tar.gz \
            ./usr/lib/neurobridge-bootstrap/source/third_party/NumCpp/CMakeLists.txt
          do
            printf '%s\n' "$listing" | grep -q "$required" || { echo "missing: $required"; exit 1; }
          done
          dpkg-deb --info artifacts/*.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neurobridge-kylin-bootstrap-deb
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Retain build environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-environment-deb-${{ strategy.job-index || '0' }}-${{ github.run_attempt }}
          path: .runtime/build-environment/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
