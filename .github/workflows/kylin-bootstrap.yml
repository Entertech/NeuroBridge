name: Kylin bootstrap package

# Builds the Kylin bootstrap deb, the package that carries the gateway source
# and builds its own runtime when installed on Galaxy Kylin.  Nothing in it is
# compiled, so it builds on a plain Ubuntu runner with dpkg-deb; it does not
# need the self-hosted Kylin runner.  The deb is an Actions artifact, not a
# release asset: installing it is what produces the runtime, on the Kylin
# machine itself.
#
# A pull request never builds it.  The two ways in match release.yml:
#
#   * after the "Test" workflow completes successfully on a push to master; and
#   * a manual dispatch, which builds the latest commit of the chosen branch.
#
# `workflow_run` reports the default-branch tip in github.sha, so the checkout
# uses SOURCE_SHA.  A workflow_run also fires for a failed or hand-dispatched
# Test run, so the job itself requires a push-triggered success.

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      offline_resources:
        description: "麒麟离线资源：all（默认）、none 或逗号分隔的 python,cmake,eigen,pyserial,websockets"
        required: false
        default: all
        type: string

permissions:
  contents: read

env:
  OFFLINE_RESOURCES: ${{ inputs.offline_resources || 'all' }}
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deb:
    name: Build the Kylin bootstrap deb
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve offline resource selection
        id: resource-selection
        run: |
          key=$(python tools/prepare-kylin-bootstrap-inputs.py --offline-resources "$OFFLINE_RESOURCES" --selection-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Install dpkg-deb
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - uses: actions/cache/restore@v4
        id: kylin-cache
        if: steps.resource-selection.outputs.key != 'none'
        with:
          path: .runtime/kylin-bootstrap-inputs
          key: kylin-inputs-${{ hashFiles('config/kylin-bootstrap-inputs.toml') }}-${{ steps.resource-selection.outputs.key }}
      - name: Prepare missing locked dependency cache
        if: steps.resource-selection.outputs.key != 'none' && steps.kylin-cache.outputs.cache-hit != 'true'
        run: python tools/prepare-kylin-bootstrap-inputs.py --download --offline-resources "$OFFLINE_RESOURCES"
      - uses: actions/cache/save@v4
        if: steps.resource-selection.outputs.key != 'none' && steps.kylin-cache.outputs.cache-hit != 'true'
        with:
          path: .runtime/kylin-bootstrap-inputs
          key: kylin-inputs-${{ hashFiles('config/kylin-bootstrap-inputs.toml') }}-${{ steps.resource-selection.outputs.key }}
      - name: Verify locked dependency inputs
        run: python tools/prepare-kylin-bootstrap-inputs.py --offline-resources "$OFFLINE_RESOURCES"
      - name: Build the bootstrap deb
        run: python tools/build-kylin-bootstrap-package.py --format deb --output-dir artifacts --offline-resources "$OFFLINE_RESOURCES"
      - name: Record the package digest
        run: sha256sum artifacts/*.deb artifacts/install-bootstrap.sh | tee artifacts/SHA256SUMS
      - name: Verify source and selected offline resources in the actual package
        run: |
          python tools/check-kylin-bootstrap-payload.py --package artifacts/*.deb --offline-resources "$OFFLINE_RESOURCES"
          dpkg-deb --info artifacts/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: neurobridge-kylin-bootstrap-deb
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
