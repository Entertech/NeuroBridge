name: Test

# Code checks only. Source train publication is an explicit, separately reviewed operation.
on:
  pull_request:
    branches: [master, 'feature/**', 'bugfix/**', 'codex/**', 'dev_*', 'publish_*', 'release-candidate/**', 'finalize_*']
  push:
    branches: [master, 'feature/**', 'bugfix/**', 'codex/**', 'dev_*', 'publish_*', 'release-candidate/**', 'finalize_*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-train-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-ci.lock
      - name: Lint workflow syntax and expressions
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/source-train.yml .github/workflows/release.yml .github/workflows/kylin-bootstrap.yml
      - name: Check source stages, required jobs and reusable workflow permissions
        run: python -m tools.check_source_train_workflows
      - name: Exercise source recovery and protected finalization
        run: python -m unittest discover -s tests/source_train_contracts -v

  version-gate:
    name: Application version gate
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # The gate reads the registry with tomllib, which needs Python 3.11;
          # this runner's default python3 is older.
          python-version: '3.11'
      - name: Require a version bump when business code changes
        id: gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m tools.source_train check --event "$SOURCE_EVENT" --branch "$SOURCE_BRANCH" --base "$BASE_SHA" --head "$SOURCE_HEAD" > "$RUNNER_TEMP/release-gate.json"
          echo 'Code validation only; package publication requires an approved source train.' >> "$GITHUB_STEP_SUMMARY"

  windows-launcher:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -r requirements-ci.lock
      - name: Verify source train contracts with Windows Git and Python
        run: python -m unittest discover -s tests/source_train_contracts -v
      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($path in @(
            (Join-Path $PWD 'windows/setup-windows-gateway.ps1'),
            (Join-Path $PWD 'windows/diagnose-service.ps1'),
            (Join-Path $PWD 'windows/export-logs.ps1'),
            (Join-Path $PWD 'windows/diagnostic-context.ps1'),
            (Join-Path $PWD 'packaging/windows/install-with-logs.ps1'),
            (Join-Path $PWD 'tools/prepare-windows-candidate-runtime.ps1')
          )) {
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - run: python -m unittest discover -s tests -p test_windows_launcher.py -v
      - name: Verify release target failure isolation and retained logs on Windows
        run: python -m unittest tests.package.test_windows_release_build -v
      - name: Verify installation failure logs without an installed gateway
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_windows_install_logging.ps1
      - run: python -m unittest discover -s tests -p test_serial_startup.py -v
      - run: python -m unittest discover -s tests -p test_windows_algorithm_build.py -v
      - name: Verify recording rotation and recovery on Windows
        run: python -m unittest discover -s tests -p test_recording_rotation.py -v
      - name: Verify timestamped log rotation on Windows
        run: python -m unittest discover -s tests -p test_operational_logging.py -k TimestampedLogRotationTests -v
      - name: Build the Windows x64 algorithm with the double-click toolchain
        run: |
          python windows/gateway_helper.py config
          python windows/algorithm_build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python windows/algorithm_build.py --offline
      - name: Verify Windows project service lifecycle
        run: python -m unittest discover -s tests -p test_windows_project_service.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: windows-algorithm-x64-${{ github.sha }}
          path: .runtime/algorithm/neurobridge_affective_bridge.*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-algorithm-build-log-${{ github.sha }}
          path: .runtime/logs/windows-algorithm-build*.log
          retention-days: 14

  native-sdk-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native test prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libeigen3-dev
      - name: Build the vendored SDK, bridge and synthetic regression tests
        run: |
          cmake -S third_party/NumCpp -B "$RUNNER_TEMP/numcpp-build" \
            -DNUMCPP_NO_USE_BOOST=ON -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/numcpp-prefix"
          cmake --install "$RUNNER_TEMP/numcpp-build"
          cmake -S mac/algorithm_bridge -B "$RUNNER_TEMP/sdk-tests" \
            -DCMAKE_BUILD_TYPE=Release \
            -DAFFECTIVE_SDK_SOURCE_DIR="$GITHUB_WORKSPACE/third_party/AffectiveCloud-Algorithm-SDK" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/numcpp-prefix" \
            -DNUMCPP_NO_USE_BOOST=ON -DNEUROBRIDGE_BUILD_SDK_TESTS=ON
          cmake --build "$RUNNER_TEMP/sdk-tests" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/sdk-tests" --output-on-failure

  unit-and-websocket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -r requirements-ci.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/capture_connection_order.cjs
      - run: python -m compileall -q neurobridge
      - run: bash tools/check-external-protocol.sh
      - name: Detect unpublished external documents
        id: external-document-state
        run: |
          state="$(python tools/mark-external-documents-published.py --check)"
          test "$state" = true || test "$state" = false
          echo "has_unpublished=$state" >> "$GITHUB_OUTPUT"
      - name: Require publication state before merge
        if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && steps.external-document-state.outputs.has_unpublished == 'true'
        run: |
          echo "External documents must be promoted and locked on this PR branch before it can merge." >&2
          echo "Run: python3 tools/mark-external-documents-published.py --date YYYY-MM-DD" >&2
          exit 1
