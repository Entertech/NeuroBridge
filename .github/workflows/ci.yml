name: Test

# This workflow only validates.  Packaging lives in release.yml, which runs
# after this workflow succeeds on master or on a manual dispatch, so a pull
# request never produces a package.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-gate:
    name: Application version gate
    # release.yml only runs after a push to master, so the gate has to run here
    # too, or a PR could merge a shipped-file change with no version bump.  This
    # is a check, not packaging: it produces no artifact.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # The gate reads the registry with tomllib, which needs Python 3.11;
          # this runner's default python3 is older.
          python-version: '3.11'
      - name: Require a version bump when shipped files change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/release_pipeline.py gate --base "$BASE_SHA" --output "$RUNNER_TEMP/release-gate.json"

  windows-launcher:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - run: python -m pip install -r requirements.lock
      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($path in @(
            (Join-Path $PWD 'windows/setup-windows-gateway.ps1'),
            (Join-Path $PWD 'windows/diagnose-service.ps1'),
            (Join-Path $PWD 'windows/export-logs.ps1'),
            (Join-Path $PWD 'windows/diagnostic-context.ps1'),
            (Join-Path $PWD 'packaging/windows/install-with-logs.ps1'),
            (Join-Path $PWD 'tools/prepare-windows-candidate-runtime.ps1')
          )) {
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - run: python -m unittest discover -s tests -p test_windows_launcher.py -v
      - name: Verify installation failure logs without an installed gateway
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_windows_install_logging.ps1
      - run: python -m unittest discover -s tests -p test_serial_startup.py -v
      - run: python -m unittest discover -s tests -p test_windows_algorithm_build.py -v
      - name: Verify recording rotation and recovery on Windows
        run: python -m unittest discover -s tests -p test_recording_rotation.py -v
      - name: Verify timestamped log rotation on Windows
        run: python -m unittest discover -s tests -p test_operational_logging.py -k TimestampedLogRotationTests -v
      - name: Build the Windows x64 algorithm with the double-click toolchain
        run: |
          python windows/gateway_helper.py config
          python windows/algorithm_build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python windows/algorithm_build.py --offline
      - name: Verify Windows project service lifecycle
        run: python -m unittest discover -s tests -p test_windows_project_service.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: windows-algorithm-x64-${{ github.sha }}
          path: .runtime/algorithm/neurobridge_affective_bridge.*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-algorithm-build-log-${{ github.sha }}
          path: .runtime/logs/windows-algorithm-build*.log
          retention-days: 14

  unit-and-websocket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/capture_connection_order.cjs
      - run: python -m compileall -q neurobridge
      - run: bash tools/check-external-protocol.sh
      - name: Detect unpublished external documents
        id: external-document-state
        run: |
          state="$(python tools/mark-external-documents-published.py --check)"
          test "$state" = true || test "$state" = false
          echo "has_unpublished=$state" >> "$GITHUB_OUTPUT"
      - name: Require publication state before merge
        if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && steps.external-document-state.outputs.has_unpublished == 'true'
        run: |
          echo "External documents must be promoted and locked on this PR branch before it can merge." >&2
          echo "Run: python3 tools/mark-external-documents-published.py --date YYYY-MM-DD" >&2
          exit 1
