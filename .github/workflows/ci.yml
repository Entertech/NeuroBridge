name: Test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      protocol_version:
        description: "可选：额外生成指定北向协议 PDF，例如 0.2 或 v0.2"
        required: false
        type: string
      protocol_stage:
        description: "额外北向协议 PDF 的阶段；published 为正式对外版本，prerelease 为内部评审稿"
        required: false
        default: published
        type: choice
        options:
          - published
          - prerelease
      external_document_mode:
        description: "candidate 仅生成内部候选包；publish 仅允许所有打包源文档已发布并锁定时生成正式 ZIP。"
        required: false
        default: candidate
        type: choice
        options:
          - publish
          - candidate

permissions:
  contents: write
  pull-requests: write

jobs:
  unit-and-websocket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q neurobridge
      - run: bash tools/check-external-protocol.sh
      - name: Detect unpublished external documents
        id: external-document-state
        run: |
          state="$(python tools/mark-external-documents-published.py --check)"
          test "$state" = true || test "$state" = false
          echo "has_unpublished=$state" >> "$GITHUB_OUTPUT"
      - name: Install protocol PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Sans CJK SC" | grep -Eqi "Noto.*CJK"
      - name: Build external document PDF package and page previews
        if: github.event_name != 'push' || github.ref != 'refs/heads/master' || steps.external-document-state.outputs.has_unpublished != 'true'
        env:
          EXTERNAL_DOCUMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.external_document_mode || (github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.external-document-state.outputs.has_unpublished == 'false' && 'publish') || 'candidate' }}
          PROTOCOL_VERSION: ${{ inputs.protocol_version }}
          PROTOCOL_STAGE: ${{ inputs.protocol_stage || 'published' }}
        run: |
          mkdir -p artifacts/document-preview "$RUNNER_TEMP/external-document-pdfs"
          python tools/build-external-document-package.py \
            --output-dir artifacts \
            --pdf-dir "$RUNNER_TEMP/external-document-pdfs" \
            --mode "$EXTERNAL_DOCUMENT_MODE"
          test -s artifacts/neurobridge-external-documents.zip
          test -s artifacts/release-manifest.json
          find "$RUNNER_TEMP/external-document-pdfs" -type f -name '*.pdf' -print0 | while IFS= read -r -d '' pdf_path; do
            pdfinfo "$pdf_path"
            pdffonts "$pdf_path" | grep -Eqi "Noto.*CJK|NotoSansCJK"
            name=$(basename "$pdf_path" .pdf)
            pdftoppm -png -r 144 "$pdf_path" "artifacts/document-preview/$name"
          done
          test "$(find "$RUNNER_TEMP/external-document-pdfs" -type f -name '*.pdf' | wc -l | tr -d ' ')" = 3
          test "$(find artifacts/document-preview -type f -name '*.png' | wc -l | tr -d ' ')" -ge 3
          if [[ -n "$PROTOCOL_VERSION" ]]; then
            mkdir -p artifacts/requested-protocol
            python tools/build-external-protocol-artifact.py \
              --output-dir artifacts/requested-protocol \
              --stage "$PROTOCOL_STAGE" \
              --version "$PROTOCOL_VERSION"
          fi
      - name: Upload external document ZIP artifact
        if: github.event_name != 'push' || github.ref != 'refs/heads/master' || steps.external-document-state.outputs.has_unpublished != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: external-document-package
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Create publication-state follow-up PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.external-document-state.outputs.has_unpublished == 'true'
        env:
          RELEASE_BRANCH: codex/publish-external-documents-${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git switch -c "$RELEASE_BRANCH"
          test "$(git branch --show-current)" = "$RELEASE_BRANCH"
          python tools/mark-external-documents-published.py --date "$(date -u +%F)"
          bash tools/check-external-protocol.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neurobridge/version_registry.toml doc/tech/对外/头环数据网关\ SSH\ 运维操作指南/头环数据网关\ SSH\ 运维操作指南_v1.0.md doc/tech/对外/头环数据网关北向网络协议/版本变更记录.md
          git diff --cached --check
          git commit -m "[codex] docs: mark external documents published"
          git push origin "HEAD:$RELEASE_BRANCH"
          gh pr create --base master --head "$RELEASE_BRANCH" --title "[codex] docs: publish external documents" --body "Automated follow-up after merging unpublished external documents. The final ZIP Artifact is generated after this PR merges."
