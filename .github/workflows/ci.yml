name: Test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      external_document_mode:
        description: "candidate 仅生成内部候选包；publish 仅允许所有打包源文档已发布并锁定时生成正式 ZIP。"
        required: false
        default: candidate
        type: choice
        options:
          - publish
          - candidate

permissions:
  contents: read

jobs:
  unit-and-websocket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q neurobridge
      - run: bash tools/check-external-protocol.sh
      - name: Detect unpublished external documents
        id: external-document-state
        run: |
          state="$(python tools/mark-external-documents-published.py --check)"
          test "$state" = true || test "$state" = false
          echo "has_unpublished=$state" >> "$GITHUB_OUTPUT"
      - name: Require publication state before merge
        if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && steps.external-document-state.outputs.has_unpublished == 'true'
        run: |
          echo "External documents must be promoted and locked on this PR branch before it can merge." >&2
          echo "Run: python3 tools/mark-external-documents-published.py --date YYYY-MM-DD" >&2
          exit 1
      - name: Install protocol PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Sans CJK SC" | grep -Eqi "Noto.*CJK"
      - name: Build and validate external document PDF package
        env:
          EXTERNAL_DOCUMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.external_document_mode || (github.event_name == 'push' && github.ref == 'refs/heads/master' && 'publish') || 'candidate' }}
        run: |
          mkdir -p "$RUNNER_TEMP/document-preview" "$RUNNER_TEMP/external-document-pdfs" "$RUNNER_TEMP/external-document-package"
          python tools/build-external-document-package.py \
            --output-dir "$RUNNER_TEMP/external-document-package" \
            --pdf-dir "$RUNNER_TEMP/external-document-pdfs" \
            --mode "$EXTERNAL_DOCUMENT_MODE"
          test -s "$RUNNER_TEMP/external-document-package/neurobridge-external-documents.zip"
          test -s "$RUNNER_TEMP/external-document-package/release-manifest.json"
          find "$RUNNER_TEMP/external-document-pdfs" -type f -name '*.pdf' -print0 | while IFS= read -r -d '' pdf_path; do
            pdfinfo "$pdf_path"
            pdffonts "$pdf_path" | grep -Eqi "Noto.*CJK|NotoSansCJK"
            name=$(basename "$pdf_path" .pdf)
            pdftoppm -png -r 144 "$pdf_path" "$RUNNER_TEMP/document-preview/$name"
          done
          test "$(find "$RUNNER_TEMP/external-document-pdfs" -type f -name '*.pdf' | wc -l | tr -d ' ')" = 4
          test "$(find "$RUNNER_TEMP/document-preview" -type f -name '*.png' | wc -l | tr -d ' ')" -ge 4
      - name: Upload external document ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: external-document-package
          path: ${{ runner.temp }}/external-document-package/neurobridge-external-documents.zip
          if-no-files-found: error
          retention-days: 90
