name: Test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      protocol_version:
        description: "可选：额外生成指定北向协议 PDF，例如 0.2 或 v0.2"
        required: false
        type: string
      protocol_stage:
        description: "额外北向协议 PDF 的阶段；published 为正式对外版本，prerelease 为内部评审稿"
        required: false
        default: published
        type: choice
        options:
          - published
          - prerelease
      external_document_mode:
        description: "candidate 仅生成内部候选包；publish 仅允许所有打包源文档已发布并锁定时生成正式 ZIP。"
        required: false
        default: candidate
        type: choice
        options:
          - publish
          - candidate

permissions:
  contents: read

jobs:
  windows-launcher:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - run: python -m pip install -r requirements.lock
      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @('setup-windows-gateway.ps1', 'diagnose-service.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/windows/$script", [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - run: python -m unittest discover -s tests -p test_windows_launcher.py -v
      - run: python -m unittest discover -s tests -p test_serial_startup.py -v
      - run: python -m unittest discover -s tests -p test_windows_algorithm_build.py -v
      - name: Verify recording rotation and recovery on Windows
        run: python -m unittest discover -s tests -p test_recording_rotation.py -v
      - name: Verify timestamped log rotation on Windows
        run: python -m unittest discover -s tests -p test_operational_logging.py -k TimestampedLogRotationTests -v
      - name: Build the Windows x64 algorithm with the double-click toolchain
        run: |
          python windows/gateway_helper.py config
          python windows/algorithm_build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python windows/algorithm_build.py --offline
      - name: Verify Windows project service lifecycle
        run: python -m unittest discover -s tests -p test_windows_project_service.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: windows-algorithm-x64-${{ github.sha }}
          path: .runtime/algorithm/neurobridge_affective_bridge.*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-algorithm-build-log-${{ github.sha }}
          path: .runtime/logs/windows-algorithm-build*.log
          retention-days: 14

  unit-and-websocket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/capture_connection_order.cjs
      - run: python -m compileall -q neurobridge
      - run: bash tools/check-external-protocol.sh
      - name: Detect unpublished external documents
        id: external-document-state
        run: |
          state="$(python tools/mark-external-documents-published.py --check)"
          test "$state" = true || test "$state" = false
          echo "has_unpublished=$state" >> "$GITHUB_OUTPUT"
      - name: Require publication state before merge
        if: (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && steps.external-document-state.outputs.has_unpublished == 'true'
        run: |
          echo "External documents must be promoted and locked on this PR branch before it can merge." >&2
          echo "Run: python3 tools/mark-external-documents-published.py --date YYYY-MM-DD" >&2
          exit 1
      - name: Install protocol PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Sans CJK SC" | grep -Eqi "Noto.*CJK"
      - name: Build external document PDF package and page previews
        env:
          EXTERNAL_DOCUMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.external_document_mode || (github.event_name == 'push' && github.ref == 'refs/heads/master' && 'publish') || 'candidate' }}
          PROTOCOL_VERSION: ${{ inputs.protocol_version }}
          PROTOCOL_STAGE: ${{ inputs.protocol_stage || 'published' }}
        run: |
          mkdir -p artifacts/document-preview "$RUNNER_TEMP/external-document-pdfs"
          python tools/build-external-document-package.py \
            --output-dir artifacts \
            --pdf-dir "$RUNNER_TEMP/external-document-pdfs" \
            --mode "$EXTERNAL_DOCUMENT_MODE"
          test -s artifacts/neurobridge-external-documents.zip
          test -s artifacts/release-manifest.json
          find "$RUNNER_TEMP/external-document-pdfs" -type f -name '*.pdf' -print0 | while IFS= read -r -d '' pdf_path; do
            pdfinfo "$pdf_path"
            pdffonts "$pdf_path" | grep -Eqi "Noto.*CJK|NotoSansCJK"
            name=$(basename "$pdf_path" .pdf)
            pdftoppm -png -r 144 "$pdf_path" "artifacts/document-preview/$name"
          done
          test "$(find "$RUNNER_TEMP/external-document-pdfs" -type f -name '*.pdf' | wc -l | tr -d ' ')" = 4
          test "$(find artifacts/document-preview -type f -name '*.png' | wc -l | tr -d ' ')" -ge 4
          if [[ -n "$PROTOCOL_VERSION" ]]; then
            mkdir -p artifacts/requested-protocol
            python tools/build-external-protocol-artifact.py \
              --output-dir artifacts/requested-protocol \
              --stage "$PROTOCOL_STAGE" \
              --version "$PROTOCOL_VERSION"
          fi
      - name: Upload external document ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: external-document-package
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  product-candidates:
    name: Unsigned ${{ matrix.platform }} product candidate
    needs: unit-and-websocket
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: kylin
            runner: ubuntu-latest
          - platform: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build unsigned candidate and metadata
        run: python tools/build-product-candidate.py --platform ${{ matrix.platform }} --output-dir artifacts --require-clean
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: neurobridge-${{ matrix.platform }}-unsigned-candidate
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  release-plan:
    name: Release version gate and 32-target plan
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-22.04
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate application version and plan targets
        id: plan
        env:
          RELEASE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          python tools/release_pipeline.py gate --base "$RELEASE_BASE" --output "$RUNNER_TEMP/release-gate.json"
          python tools/release_pipeline.py plan --output "$RUNNER_TEMP/release-matrix.json" > "$RUNNER_TEMP/release-matrix.log"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP'])
          gate = json.loads((directory / 'release-gate.json').read_text())
          matrix = json.loads((directory / 'release-matrix.json').read_text())
          print('should_release=' + str(gate['shouldRelease']).lower())
          print('version=' + gate['applicationVersion'])
          print('matrix=' + json.dumps(matrix, separators=(',', ':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-gate.json
            ${{ runner.temp }}/release-matrix.json
          if-no-files-found: error
          retention-days: 30

  release-targets:
    name: Release target ${{ matrix.id }}
    needs: [release-plan, unit-and-websocket, windows-launcher]
    if: needs.release-plan.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.matrix) }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve approved offline target input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ vars.NEUROBRIDGE_RELEASE_INPUT_RUN_ID }}
          TARGET_ID: ${{ matrix.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-inputs/$TARGET_ID"
          mkdir -p "artifacts/targets/$TARGET_ID"
          if [[ -z "$INPUT_RUN_ID" ]]; then
            printf '%s\n' 'blocked: NEUROBRIDGE_RELEASE_INPUT_RUN_ID is unset' > "artifacts/targets/$TARGET_ID/input-fetch.log"
          else
            if gh run view "$INPUT_RUN_ID" --json headSha,headBranch,conclusion > "$RUNNER_TEMP/release-input-run.json" 2> "artifacts/targets/$TARGET_ID/input-fetch.log" && \
              python -c 'import json,os,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d.get("headSha")==os.environ["GITHUB_SHA"] and d.get("headBranch")=="master" and d.get("conclusion")=="success" else 1)' "$RUNNER_TEMP/release-input-run.json"; then
              if gh run download "$INPUT_RUN_ID" --name "neurobridge-input-$TARGET_ID" --dir "$RUNNER_TEMP/release-inputs/$TARGET_ID" >> "artifacts/targets/$TARGET_ID/input-fetch.log" 2>&1; then
                printf '%s\n' 'offline input retrieval completed from successful master run at this commit' >> "artifacts/targets/$TARGET_ID/input-fetch.log"
              else
                printf '%s\n' 'blocked: approved offline input artifact unavailable' >> "artifacts/targets/$TARGET_ID/input-fetch.log"
                [[ -n "$RUNNER_TEMP" && -n "$TARGET_ID" ]]
                rm -rf -- "$RUNNER_TEMP/release-inputs/$TARGET_ID"
              fi
            else
              printf '%s\n' 'blocked: input run is unavailable or does not match successful master commit' >> "artifacts/targets/$TARGET_ID/input-fetch.log"
            fi
          fi
      - name: Verify target package and write result log
        shell: bash
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          python tools/release_pipeline.py target \
            --target "$TARGET_ID" \
            --input-root "$RUNNER_TEMP/release-inputs" \
            --output-root artifacts/targets
      - uses: actions/upload-artifact@v4
        with:
          name: release-target-${{ matrix.id }}
          path: artifacts/targets/
          if-no-files-found: error
          retention-days: 30

  release-aggregate:
    name: Verify packages and assemble one release ZIP
    needs: [release-plan, release-targets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.release-plan.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-target-*
          path: artifacts/targets
          merge-multiple: true
      - name: Check all target results and produce verified ZIP
        run: python tools/release_pipeline.py aggregate --results-root artifacts/targets --output artifacts/release
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30

  release-publish:
    name: Publish verified release
    needs: [release-plan, release-aggregate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.release-aggregate.result == 'success'
    runs-on: ubuntu-22.04
    concurrency:
      group: release-${{ github.repository }}-${{ needs.release-plan.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-${{ github.sha }}
          path: artifacts/release
      - name: Create immutable tag, draft Release and verify public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.publish_release --dir artifacts/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-receipt-${{ github.sha }}
          path: artifacts/release/release-receipt.json
          if-no-files-found: error
          retention-days: 30
