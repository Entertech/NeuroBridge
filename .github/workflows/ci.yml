name: Test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      protocol_version:
        description: "要生成 PDF 的对外协议版本，例如 0.2 或 v0.2；留空则生成当前版本"
        required: false
        type: string

permissions:
  contents: read

jobs:
  unit-and-websocket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q neurobridge
      - run: bash tools/check-external-protocol.sh
      - name: Install protocol PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Sans CJK SC" | rg -i "Noto.*CJK"
      - name: Build external protocol PDF artifact and page previews
        env:
          PROTOCOL_VERSION: ${{ inputs.protocol_version }}
        run: |
          mkdir -p artifacts/protocol-preview
          version_args=()
          if [[ -n "$PROTOCOL_VERSION" ]]; then
            version_args=(--version "$PROTOCOL_VERSION")
          fi
          python tools/build-external-protocol-artifact.py --output-dir artifacts "${version_args[@]}"
          pdf_path=$(find artifacts -maxdepth 1 -type f -name '*.pdf' -print -quit)
          test -n "$pdf_path"
          pdfinfo "$pdf_path"
          pdffonts "$pdf_path" | tee artifacts/pdf-fonts.txt
          rg -i "Noto.*CJK|NotoSansCJK" artifacts/pdf-fonts.txt
          pdftoppm -png -r 144 "$pdf_path" artifacts/protocol-preview/page
          test -n "$(find artifacts/protocol-preview -type f -name 'page-*.png' -print -quit)"
      - name: Upload external protocol PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: external-protocol-pdf
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
