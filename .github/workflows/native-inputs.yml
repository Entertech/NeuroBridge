name: Build native release inputs

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "源码分支、提交或标签；发布时必须与目标提交一致"
        required: true
        default: master
        type: string
      platforms:
        description: "available 构建 Windows 和已注册的麒麟 x86_64；windows 仅构建 Windows；all 排队全部麒麟架构"
        required: true
        default: available
        type: choice
        options:
          - available
          - windows
          - all

permissions:
  contents: read

jobs:
  windows:
    name: Windows native input ${{ matrix.id }}
    if: inputs.platforms == 'available' || inputs.platforms == 'windows'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-7-x86-exe
          - id: windows-7-x86-msi
          - id: windows-7-x86_64-exe
          - id: windows-7-x86_64-msi
          - id: windows-10-x86-exe
          - id: windows-10-x86-msi
          - id: windows-10-x86_64-exe
          - id: windows-10-x86_64-msi
          - id: windows-11-x86-exe
          - id: windows-11-x86-msi
          - id: windows-11-x86_64-exe
          - id: windows-11-x86_64-msi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Prepare artifact directory
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path artifacts\input | Out-Null
      - uses: actions/setup-python@v5
        if: contains(matrix.id, 'x86_64') && !startsWith(matrix.id, 'windows-7-')
        with:
          python-version: "3.11"
          architecture: x64
      - name: Prepare the locked Windows runtime
        if: contains(matrix.id, 'x86_64') && !startsWith(matrix.id, 'windows-7-')
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/prepare-windows-candidate-runtime.ps1
      - name: Install the unsigned WiX build tool
        if: contains(matrix.id, 'x86_64') && !startsWith(matrix.id, 'windows-7-')
        shell: powershell
        run: |
          dotnet tool install --global wix --version 7.0.0
          "${env:USERPROFILE}\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wix eula accept wix7
          wix extension add WixToolset.BootstrapperApplications.wixext/7.0.0 --global
          wix --version
      - name: Build native installer from source
        if: contains(matrix.id, 'x86_64') && !startsWith(matrix.id, 'windows-7-')
        shell: powershell
        run: |
          python tools\build-native-package.py `
            --target "${{ matrix.id }}" `
            --runtime-dir artifacts\windows-runtime `
            --output-dir artifacts\input
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record blocked target
        if: ${{ !(contains(matrix.id, 'x86_64') && !startsWith(matrix.id, 'windows-7-')) }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\input | Out-Null
          @"
          blocked: Windows 7 requires the separate Python 3.8 compatibility port and Windows x86 requires a verified x86 runtime; neither is available in the current source build.
          "@ | Set-Content artifacts\input\blocked.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neurobridge-input-${{ matrix.id }}
          path: artifacts/input/
          if-no-files-found: error
          retention-days: 30

  kylin:
    name: Kylin native input ${{ matrix.id }}
    if: inputs.platforms == 'all' || inputs.platforms == 'available'
    # The runner must be a target-compatible Kylin V10 machine or a runner
    # with the approved cross toolchain and sysroot for this architecture.
    runs-on:
      - self-hosted
      - kylin-v10
      - ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'all' && '[{"id":"kylin-server-x86_64-deb","architecture":"x86_64"},{"id":"kylin-server-x86_64-rpm","architecture":"x86_64"},{"id":"kylin-desktop-x86_64-deb","architecture":"x86_64"},{"id":"kylin-desktop-x86_64-rpm","architecture":"x86_64"},{"id":"kylin-server-arm64-deb","architecture":"arm64"},{"id":"kylin-server-arm64-rpm","architecture":"arm64"},{"id":"kylin-server-loongarch64-deb","architecture":"loongarch64"},{"id":"kylin-server-loongarch64-rpm","architecture":"loongarch64"},{"id":"kylin-server-mips64el-deb","architecture":"mips64el"},{"id":"kylin-server-mips64el-rpm","architecture":"mips64el"},{"id":"kylin-server-sw64-deb","architecture":"sw64"},{"id":"kylin-server-sw64-rpm","architecture":"sw64"},{"id":"kylin-desktop-arm64-deb","architecture":"arm64"},{"id":"kylin-desktop-arm64-rpm","architecture":"arm64"},{"id":"kylin-desktop-loongarch64-deb","architecture":"loongarch64"},{"id":"kylin-desktop-loongarch64-rpm","architecture":"loongarch64"},{"id":"kylin-desktop-mips64el-deb","architecture":"mips64el"},{"id":"kylin-desktop-mips64el-rpm","architecture":"mips64el"},{"id":"kylin-desktop-sw64-deb","architecture":"sw64"},{"id":"kylin-desktop-sw64-rpm","architecture":"sw64"}]' || '[{"id":"kylin-server-x86_64-deb","architecture":"x86_64"},{"id":"kylin-server-x86_64-rpm","architecture":"x86_64"},{"id":"kylin-desktop-x86_64-deb","architecture":"x86_64"},{"id":"kylin-desktop-x86_64-rpm","architecture":"x86_64"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Build the native Kylin installer from source
        id: build
        env:
          RUNTIME_DIR: ${{ vars.NEUROBRIDGE_KYLIN_RUNTIME_ROOT }}/${{ matrix.id }}/runtime
        run: |
          set -uo pipefail
          mkdir -p artifacts/input
          {
            printf 'target=%s\n' "${{ matrix.id }}"
            printf 'runtime_dir=%s\n' "$RUNTIME_DIR"
            uname -a || true
            id || true
            command -v getstatus >/dev/null 2>&1 && getstatus || true
          } > artifacts/input/diagnostics.log 2>&1
          if [ ! -d "$RUNTIME_DIR" ]; then
            printf '%s\n' "blocked: NEUROBRIDGE_KYLIN_RUNTIME_ROOT does not contain ${{ matrix.id }}/runtime" > artifacts/input/blocked.log
            exit 0
          fi
          # The staged runtime is the only interpreter that satisfies the
          # repository's Python 3.11 requirement; the system python3 is older.
          interpreter="$RUNTIME_DIR/bin/python"
          if [ ! -x "$interpreter" ]; then
            printf '%s\n' "blocked: ${{ matrix.id }}/runtime does not provide an executable bin/python" > artifacts/input/blocked.log
            exit 0
          fi
          "$interpreter" --version >> artifacts/input/diagnostics.log 2>&1 || true
          if ! "$interpreter" tools/build-native-package.py \
              --target "${{ matrix.id }}" \
              --runtime-dir "$RUNTIME_DIR" \
              --output-dir artifacts/input > artifacts/input/build.log 2>&1; then
            {
              printf '%s\n' "blocked: native package build failed for ${{ matrix.id }}"
              tail -n 60 artifacts/input/build.log 2>/dev/null || true
            } > artifacts/input/blocked.log
            rm -f artifacts/input/build.log
          else
            rm -f artifacts/input/build.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neurobridge-input-${{ matrix.id }}
          path: artifacts/input/
          if-no-files-found: error
          retention-days: 30

  publish-input-run:
    name: Record this run as the release input
    needs: [windows, kylin]
    # The release aggregation reads vars.NEUROBRIDGE_RELEASE_INPUT_RUN_ID.
    # Only a run that produced both platform sets may replace it: a partial
    # build (for example platforms=windows) would silently drop the other
    # platform from the next release bundle.
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.kylin.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Point the release aggregation at this run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          gh variable set NEUROBRIDGE_RELEASE_INPUT_RUN_ID \
            --repo "$GITHUB_REPOSITORY" \
            --body "$GITHUB_RUN_ID"
          {
            printf '## Release input run recorded\n\n'
            printf '`NEUROBRIDGE_RELEASE_INPUT_RUN_ID` = `%s`\n\n' "$GITHUB_RUN_ID"
            printf -- '- run branch: `%s`\n' "$GITHUB_REF_NAME"
            printf -- '- run commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- built source ref: `%s`\n' "$SOURCE_REF"
            printf '\nThe release aggregation validates the run branch and commit, so a later\n'
            printf 'release must be built from `%s` to consume these inputs.\n' "$GITHUB_REF_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
