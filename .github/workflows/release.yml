name: Release

# Manual dispatch builds diagnostics. The source train can delegate one system's publication.
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      source_branch:
        type: string
        required: true
      source_train:
        type: boolean
        default: false
      system_releases:
        type: boolean
        default: false
      publish_system:
        type: boolean
        default: false
      recovery_runs:
        type: string
        default: ''
      train_version:
        type: string
        default: ''
      systems:
        type: string
        default: ''
      native_input_run_id:
        type: string
        default: ''
      external_document_mode:
        type: string
        default: publish
    outputs:
      artifact_id:
        value: ${{ jobs.release-aggregate.outputs.artifact_id }}
      archive_sha256:
        value: ${{ jobs.release-aggregate.outputs.archive_sha256 }}
  workflow_dispatch:
    inputs:
      systems:
        description: "可选，逗号分隔 windows-10、windows-11、kylin-v10；留空构建全量诊断包"
        type: string
      native_input_run_id:
        description: "可选：复用同源码提交的原生安装包 Run ID；留空则在本次 Release 构建 Windows EXE/MSI"
        required: false
        type: string
      external_document_mode:
        description: "candidate 仅生成内部候选包；publish 仅允许所有打包源文档已发布并锁定时生成正式 ZIP。"
        required: false
        default: publish
        type: choice
        options:
          - publish
          - candidate

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  SOURCE_BRANCH: ${{ inputs.source_branch || github.ref_name }}
  EXTERNAL_DOCUMENT_MODE: ${{ !inputs.source_train && inputs.external_document_mode || 'publish' }}
  RELEASE_SYSTEMS: ${{ inputs.systems }}
  ARTIFACT_SUFFIX: ${{ inputs.publish_system && format('-{0}', inputs.systems) || '' }}

concurrency:
  group: package-source-${{ github.repository }}-${{ inputs.source_sha || github.sha }}${{ inputs.publish_system && format('-{0}', inputs.systems) || '' }}
  cancel-in-progress: false

jobs:
  system-recovery:
    name: Locate prior verified system package
    if: inputs.publish_system && inputs.recovery_runs != ''
    continue-on-error: true
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.recover.outputs.ready }}
      run_id: ${{ steps.recover.outputs.run_id }}
    steps:
      - name: Locate the upload and its pre-upload receipt
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUNS: ${{ inputs.recovery_runs }}
        run: |
          IFS=, read -ra runs <<< "$RECOVERY_RUNS"
          for run_id in "${runs[@]}"; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || exit 1
            artifacts=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")
            state=$(jq -r --arg bundle "verified-release-$SOURCE_SHA$ARTIFACT_SUFFIX" \
              --arg receipt "train-package-receipt-$SOURCE_SHA$ARTIFACT_SUFFIX" \
              '[.[].artifacts[] | select(.name == $bundle or .name == $receipt)] |
                if length == 0 then "absent"
                elif length == 2 and ([.[].name] | unique | length) == 2 and all(.[]; .expired == false) then "ready"
                else "invalid" end' <<< "$artifacts")
            if [[ "$state" == invalid ]]; then
              echo "Prior system package or pre-upload receipt is missing, ambiguous or expired." >&2
              exit 1
            fi
            if [[ "$state" == ready ]]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              break
            fi
          done
          echo 'ready=true' >> "$GITHUB_OUTPUT"

  external-documents:
    name: Build the external document package
    # The release plan validates document inputs before any rendering or build.
    needs: [release-plan]
    if: needs.release-plan.outputs.ready == 'true'
    continue-on-error: ${{ inputs.publish_system }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ env.SOURCE_SHA }}${{ env.ARTIFACT_SUFFIX }}
          path: ${{ runner.temp }}/document-preflight
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Install protocol PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Sans CJK SC" | grep -Eqi "Noto.*CJK"
      - name: Build external document PDF package and page previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/document-preview "$RUNNER_TEMP/external-document-pdfs"
          python -m tools.build-external-document-package \
            --preflight "$RUNNER_TEMP/document-preflight/release-preflight.json" \
            --output-dir artifacts \
            --pdf-dir "$RUNNER_TEMP/external-document-pdfs" \
            --mode "$EXTERNAL_DOCUMENT_MODE"
          test -s artifacts/neurobridge-external-documents.zip
          test -s artifacts/release-manifest.json
          find "$RUNNER_TEMP/external-document-pdfs" -type f -name '*.pdf' -print0 | while IFS= read -r -d '' pdf_path; do
            pdfinfo "$pdf_path"
            pdffonts "$pdf_path" | grep -Eqi "Noto.*CJK|NotoSansCJK"
            name=$(basename "$pdf_path" .pdf)
            pdftoppm -png -r 144 "$pdf_path" "artifacts/document-preview/$name"
          done
          expected_count="$(python -c 'import json; print(json.load(open("artifacts/release-manifest.json", encoding="utf-8"))["sourceDocumentCount"])')"
          test "$(find "$RUNNER_TEMP/external-document-pdfs" -type f -name '*.pdf' | wc -l | tr -d ' ')" = "$expected_count"
      - uses: actions/upload-artifact@v4
        with:
          name: external-document-package${{ env.ARTIFACT_SUFFIX }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  product-candidates:
    name: Unsigned ${{ matrix.platform }} product candidate
    needs: [release-plan]
    if: needs.release-plan.outputs.ready == 'true' && !inputs.publish_system
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.candidate_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assemble installable Windows runtime
        if: matrix.platform == 'windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/prepare-windows-candidate-runtime.ps1
      - name: Build unsigned candidate and metadata
        shell: bash
        run: |
          runtime_args=()
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            runtime_args=(--runtime-dir artifacts/windows-runtime)
          fi
          python tools/build-product-candidate.py --platform ${{ matrix.platform }} --output-dir artifacts --require-clean "${runtime_args[@]}"
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: neurobridge-${{ matrix.platform }}-unsigned-candidate
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.release-manifest.json
          if-no-files-found: error
          retention-days: 30

  release-plan:
    name: Release preflight and target plan
    needs: [system-recovery]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || inputs.source_train) && (inputs.recovery_runs == '' || (needs.system-recovery.outputs.ready == 'true' && needs.system-recovery.outputs.run_id == '')) }}
    continue-on-error: ${{ inputs.publish_system }}
    runs-on: ubuntu-22.04
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      candidate_matrix: ${{ steps.plan.outputs.candidate_matrix }}
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate application version and plan targets
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A tag/draft left by a failed attempt is not a successful release.
          # Before the first public release, inspect the full version history.
          gate_args=(--repository "$GITHUB_REPOSITORY")
          # A manual feature-branch bundle uses the same baseline as its PR;
          # unpublished intermediate versions are not public release state.
          if [[ "${{ inputs.source_train }}" != true && "$SOURCE_BRANCH" != "$DEFAULT_BRANCH" ]]; then
            gate_args=(--base "origin/$DEFAULT_BRANCH")
          fi
          python tools/release_pipeline.py gate "${gate_args[@]}" --output "$RUNNER_TEMP/release-gate.json"
          python tools/release_pipeline.py plan --systems "$RELEASE_SYSTEMS" --output "$RUNNER_TEMP/release-matrix.json" > "$RUNNER_TEMP/release-matrix.log"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP'])
          gate = json.loads((directory / 'release-gate.json').read_text())
          matrix = json.loads((directory / 'release-matrix.json').read_text())
          print('should_release=' + str(gate['shouldRelease']).lower())
          print('version=' + gate['applicationVersion'])
          print('matrix=' + json.dumps(matrix, separators=(',', ':')))
          runners = {'kylin': 'ubuntu-latest', 'windows': 'windows-latest'}
          platforms = dict.fromkeys(target['platform'] for target in matrix['include'])
          candidate_matrix = {'include': [{'platform': platform, 'runner': runners[platform]} for platform in platforms]}
          print('candidate_matrix=' + json.dumps(candidate_matrix, separators=(',', ':')))
          PY
      - name: Preview packages and validate external documents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m tools.release_preflight \
            --head "$SOURCE_SHA" \
            --gate "$RUNNER_TEMP/release-gate.json" \
            --mode "$EXTERNAL_DOCUMENT_MODE" \
            --systems "$RELEASE_SYSTEMS" \
            --output "$RUNNER_TEMP/release-preflight.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Verify document registry and release locks
        if: steps.plan.outputs.should_release == 'true'
        run: bash tools/check-external-protocol.sh
      - name: Explain a run that needs no release
        # `success()` matters: a gate failure leaves the output unset, and this
        # step must not claim "no release needed" on top of that failure.
        if: success() && steps.plan.outputs.should_release != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          {
            printf '## No release needed\n\n'
            printf '`[application].version` is still `%s`, so nothing was packaged.\n\n' "$VERSION"
            printf 'Packaging requires an application version advance. A change to\n'
            printf 'business code without a bump fails the gate instead of being skipped here.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '::notice title=release skipped::application version is still %s; nothing was packaged\n' "$VERSION"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-plan-${{ env.SOURCE_SHA }}${{ env.ARTIFACT_SUFFIX }}
          path: |
            ${{ runner.temp }}/release-gate.json
            ${{ runner.temp }}/release-matrix.json
            ${{ runner.temp }}/release-preflight.json
          if-no-files-found: warn
          retention-days: 30
      - id: ready
        if: steps.plan.outputs.should_release == 'true'
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"

  release-targets:
    name: Release target ${{ matrix.id }}
    needs: [release-plan, external-documents]
    if: needs.release-plan.outputs.ready == 'true' && needs.external-documents.result == 'success'
    continue-on-error: ${{ inputs.publish_system }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.matrix) }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The Kylin deliverable is the bootstrap package. It is built here from
      # the checked-out source and does not consume a prebuilt runtime input.
      - name: Restore approved Kylin dependency cache
        id: kylin-cache
        continue-on-error: true
        if: matrix.platform == 'kylin'
        uses: actions/cache/restore@v4
        with:
          path: .runtime/kylin-bootstrap-inputs
          key: kylin-inputs-${{ hashFiles('config/kylin-bootstrap-inputs.toml') }}
          fail-on-cache-miss: true
      - name: Record missing Kylin dependency cache
        if: matrix.platform == 'kylin' && steps.kylin-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "artifacts/targets/${{ matrix.id }}"
          printf '%s\n' 'blocked: approved Kylin dependency cache missing; prepare and verify locked inputs first' > "artifacts/targets/${{ matrix.id }}/input-fetch.log"
      - name: Build the Kylin bootstrap package
        if: matrix.platform == 'kylin' && steps.kylin-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "artifacts/targets/${{ matrix.id }}"
          exec > >(tee "artifacts/targets/${{ matrix.id }}/input-fetch.log") 2>&1
          trap 'status=$?; if [[ $status -ne 0 ]]; then printf "blocked: Kylin dependency/package build failed exit_code=%s; see this log\n" "$status"; fi' EXIT
          sudo apt-get update && sudo apt-get install -y dpkg-dev
          python tools/prepare-kylin-bootstrap-inputs.py
          python tools/build-kylin-bootstrap-package.py --format deb --output-dir "$RUNNER_TEMP/release-inputs/${{ matrix.id }}"
          python tools/write-kylin-bootstrap-verification.py \
            --target "${{ matrix.id }}" \
            --input-dir "$RUNNER_TEMP/release-inputs/${{ matrix.id }}"
      # Automatic releases have no workflow_dispatch inputs. Build real native
      # installers here instead of waiting for a native_input_run_id that can
      # never be supplied by the automatic call. Source ZIP candidates are unrelated.
      - name: Build Windows native release input
        if: matrix.platform == 'windows' && inputs.native_input_run_id == ''
        shell: bash
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          python tools/release_pipeline.py build-windows \
            --target "$TARGET_ID" \
            --input-root "$RUNNER_TEMP/release-inputs" \
            --output-root artifacts/targets
      - name: Retrieve approved offline target input
        if: matrix.platform == 'windows' && inputs.native_input_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.native_input_run_id }}
          TARGET_ID: ${{ matrix.id }}
          EXPECTED_SOURCE_SHA: ${{ env.SOURCE_SHA }}
          EXPECTED_BRANCH: ${{ env.SOURCE_BRANCH }}
        run: |
          mkdir -p "artifacts/targets/$TARGET_ID"
          if [[ -z "$INPUT_RUN_ID" ]]; then
            printf '%s\n' 'blocked: native_input_run_id was not provided; specify it when manually dispatching Release' > "artifacts/targets/$TARGET_ID/input-fetch.log"
          else
            if gh run view "$INPUT_RUN_ID" --json headSha,headBranch,conclusion > "$RUNNER_TEMP/release-input-run.json" 2> "artifacts/targets/$TARGET_ID/input-fetch.log" && \
              python -c 'import json,os,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d.get("headSha")==os.environ["EXPECTED_SOURCE_SHA"] and d.get("headBranch")==os.environ["EXPECTED_BRANCH"] and d.get("conclusion")=="success" else 1)' "$RUNNER_TEMP/release-input-run.json"; then
              if gh run download "$INPUT_RUN_ID" --name "neurobridge-input-$TARGET_ID" --dir "$RUNNER_TEMP/release-inputs/$TARGET_ID" >> "artifacts/targets/$TARGET_ID/input-fetch.log" 2>&1; then
                printf '%s\n' 'offline input retrieval completed from successful run at this source commit' >> "artifacts/targets/$TARGET_ID/input-fetch.log"
              else
                printf '%s\n' 'blocked: approved offline input artifact unavailable' >> "artifacts/targets/$TARGET_ID/input-fetch.log"
                [[ -n "$RUNNER_TEMP" && -n "$TARGET_ID" ]]
                rm -rf -- "$RUNNER_TEMP/release-inputs/$TARGET_ID"
              fi
            else
              printf '%s\n' 'blocked: input run is unavailable or does not match successful source commit and branch' >> "artifacts/targets/$TARGET_ID/input-fetch.log"
            fi
          fi
      - name: Verify target package and write result log
        if: always()
        shell: bash
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          python tools/release_pipeline.py target \
            --target "$TARGET_ID" \
            --input-root "$RUNNER_TEMP/release-inputs" \
            --output-root artifacts/targets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-target-${{ matrix.id }}${{ env.ARTIFACT_SUFFIX }}
          path: artifacts/targets/
          if-no-files-found: error
          retention-days: 30

  release-aggregate:
    name: Verify packages and assemble one release ZIP
    needs: [release-plan, release-targets]
    if: ${{ !cancelled() && needs.release-plan.outputs.ready == 'true' && needs.release-targets.result == 'success' }}
    continue-on-error: ${{ inputs.publish_system }}
    runs-on: ubuntu-22.04
    env:
      DELIVERY_DIR: artifacts/delivery
      DELIVERY_ZIP: artifacts/delivery/neurobridge-v${{ needs.release-plan.outputs.version }}.zip
    outputs:
      archive_sha256: ${{ steps.bundle.outputs.archive_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-target-*${{ env.ARTIFACT_SUFFIX }}
          path: artifacts/targets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: external-document-package${{ env.ARTIFACT_SUFFIX }}
          path: artifacts/documents
      - uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ env.SOURCE_SHA }}${{ env.ARTIFACT_SUFFIX }}
          path: artifacts/preflight
      - name: Check all target results and produce verified ZIP
        env:
          # `push_master` is the only trigger that enforces the minimum-package
          # gate, so a manual branch build is deliberately the relaxed mode.
          RELEASE_TRIGGER: ${{ inputs.source_train && 'push_master' || 'pull_request' }}
        run: python tools/release_pipeline.py aggregate --results-root artifacts/targets --output artifacts/release --trigger "$RELEASE_TRIGGER" --systems "$RELEASE_SYSTEMS"
      - name: Install delivery directory PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils fonts-noto-cjk
          fc-cache -f
      - name: Assemble one user-facing release bundle
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          SYSTEM_RELEASES: ${{ inputs.system_releases }}
        run: |
          system_args=()
          if [[ "$SYSTEM_RELEASES" == true ]]; then system_args=(--system-results artifacts/targets); fi
          python tools/build-release-bundle.py \
            --release-dir artifacts/release \
            --documents-dir artifacts/documents \
            --preflight artifacts/preflight/release-preflight.json \
            --output "$DELIVERY_ZIP" "${system_args[@]}"
          printf 'archive_sha256=%s\n' "$(sha256sum "$DELIVERY_ZIP" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Check directory PDF and render every page
        run: |
          mkdir -p "$RUNNER_TEMP/directory-guide" artifacts/directory-guide-preview
          unzip -p "$DELIVERY_ZIP" bundle-directory-guide.pdf > "$RUNNER_TEMP/directory-guide/bundle-directory-guide.pdf"
          pdfinfo "$RUNNER_TEMP/directory-guide/bundle-directory-guide.pdf"
          pdffonts "$RUNNER_TEMP/directory-guide/bundle-directory-guide.pdf" | tee "$RUNNER_TEMP/directory-guide/fonts.txt"
          if ! grep -Eqi "Noto.*(CJK|SansSC|SerifSC)" "$RUNNER_TEMP/directory-guide/fonts.txt"; then
            # Skia Type3 subsets can appear as [none] in pdffonts despite
            # retaining the embedded font's name in its FontDescriptor.
            python - "$RUNNER_TEMP/directory-guide/bundle-directory-guide.pdf" <<'PY'
          from pathlib import Path
          import re, sys
          names = sorted(set(re.findall(rb'/FontName\s*/([^\s/<>\[\]()]+)', Path(sys.argv[1]).read_bytes())))
          print('PDF font descriptors:', [name.decode('ascii', errors='replace') for name in names])
          if not any(re.search(rb'Noto.*(?:CJK|SansSC|SerifSC)', name, re.I) for name in names):
              raise SystemExit('No embedded Noto Chinese font found in the directory PDF')
          PY
          fi
          pdftoppm -png -r 144 "$RUNNER_TEMP/directory-guide/bundle-directory-guide.pdf" artifacts/directory-guide-preview/page
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-directory-guide-preview-${{ env.SOURCE_SHA }}${{ env.ARTIFACT_SUFFIX }}
          path: artifacts/directory-guide-preview/
          if-no-files-found: error
          retention-days: 30
      - name: Verify every defined installer and persist the pre-upload receipt
        if: inputs.source_train
        env:
          SYSTEM_RELEASES: ${{ inputs.system_releases }}
        run: |
          system_args=()
          if [[ "$SYSTEM_RELEASES" == true ]]; then system_args=(--system-bundles); fi
          python -m tools.source_train verify-package \
            --version "${{ needs.release-plan.outputs.version }}" --candidate "$SOURCE_SHA" \
            --systems "$RELEASE_SYSTEMS" \
            "${system_args[@]}" \
            --directory "$DELIVERY_DIR" > "$RUNNER_TEMP/package-receipt.json"
      - uses: actions/upload-artifact@v4
        if: inputs.source_train
        with:
          name: train-package-receipt-${{ env.SOURCE_SHA }}${{ env.ARTIFACT_SUFFIX }}
          path: ${{ runner.temp }}/package-receipt.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: verified-release-${{ env.SOURCE_SHA }}${{ env.ARTIFACT_SUFFIX }}
          path: artifacts/delivery/
          if-no-files-found: error
          retention-days: 90

  publish-system:
    name: Publish this system after package verification
    needs: [system-recovery, release-aggregate]
    if: ${{ !cancelled() && inputs.publish_system && (needs.system-recovery.outputs.run_id != '' || needs.release-aggregate.outputs.artifact_id != '') }}
    continue-on-error: true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-${{ env.SOURCE_SHA }}${{ env.ARTIFACT_SUFFIX }}
          github-token: ${{ steps.app.outputs.token }}
          run-id: ${{ needs.system-recovery.outputs.run_id || github.run_id }}
          path: ${{ runner.temp }}/system-delivery
      - uses: actions/download-artifact@v4
        with:
          name: train-package-receipt-${{ env.SOURCE_SHA }}${{ env.ARTIFACT_SUFFIX }}
          github-token: ${{ steps.app.outputs.token }}
          run-id: ${{ needs.system-recovery.outputs.run_id || github.run_id }}
          path: ${{ runner.temp }}/system-proof
      - name: Tag and publish only this verified system
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TRAIN_APP_TOKEN_USED: 'true'
          TRAIN_APP_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          TRAIN_VERSION: ${{ inputs.train_version }}
          ARTIFACT_RUN: ${{ needs.system-recovery.outputs.run_id || github.run_id }}
        run: |
          git config user.name 'NeuroBridge release automation'
          git config user.email 'release-automation@users.noreply.github.com'
          python -m tools.source_train publish-system --version "$TRAIN_VERSION" --systems "$RELEASE_SYSTEMS" \
            --artifact-run "$ARTIFACT_RUN" --directory "$RUNNER_TEMP/system-delivery" \
            --proof "$RUNNER_TEMP/system-proof/package-receipt.json" --execute

  release-cleanup:
    name: Remove release intermediate artifacts
    needs: [release-plan, release-aggregate, product-candidates]
    if: always() && !inputs.publish_system && needs.release-aggregate.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete intermediate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r artifact_id artifact_name; do
            # Reusable Release shares the Test run; keep its diagnostic artifacts.
            case "$artifact_name" in
              release-target-*|external-document-package|neurobridge-*-unsigned-candidate|delivery-directory-guide-preview-*)
                gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id" ;;
            esac
          done
