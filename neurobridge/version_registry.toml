date = "2026-09-02"
scope = "gateway_local_browser_capture_diagnostics"
summary = "网关托管的 web/capture 页面新增一键导出本机诊断日志，记录连接与订阅状态、数据包/字节计数、最新序列号、丢包统计、解析异常和脱敏 WebSocket 协议记录；bytesBase64 与完整 EEG/心率原始字节不写入导出文件，并明确标记 rawPayloadExported=false。"
external_document_action = "record_only"
change_state = "unlocked"
base_locked_release = "0.2"
target_external_release = "0.3"
reason = "用户要求 capture 页面支持导出日志。该能力只生成本机内部诊断文件，不新增 WebSocket 动作或字段；为遵守人体原始数据和运维日志边界，导出内容默认脱敏，不修改已锁定 B 端协议。"

[[change_records]]
id = "2026-09-02-serial-algorithm-validation-state-gate"
date = "2026-09-02"
scope = "gateway_serial_state_machine_and_algorithm_gate"
summary = "USB 串口状态拆分为 not_connected、connecting、connected、validating、validation_failed、validated 和 disconnected：固定握手通过即 connected；本地算法就绪后才发送 E1；任意非空响应后才 validated 并允许实时串口数据进入录制、算法和北向转发。算法未就绪、E1 超时或控制读写异常均记录脱敏阶段日志并进入 validation_failed。"
external_document_action = "record_only"
change_state = "unlocked"
base_locked_release = "0.2"
target_external_release = "0.3"
reason = "用户明确要求将 USB 串口物理连接、算法准备和设备校验拆分，并以校验成功作为实时数据门禁。已同步内部预发布契约和现场文档；未收到更新已发布对外文档的授权，因此 v0.2 保持锁定。"

[[change_records]]
id = "2026-09-02-kylin-local-algorithm-build-and-smoke-gate"
date = "2026-09-02"
scope = "gateway_kylin_algorithm_runtime_and_operations"
summary = "银河麒麟 V10 x86_64 新增目标机本地算法准备流程：使用仓库锁定 SDK/NumCpp 构建 C++ bridge 到项目 .runtime/algorithm，缺少系统构建依赖时经 yes/no 授权后安装；无人体数据进程自检成功后才原子启用配置。串口启动脚本校验算法已启用、bridge 为项目内可执行普通文件，失败则禁止启动与发送 E1。"
external_document_action = "record_only"
change_state = "unlocked"
base_locked_release = "0.2"
target_external_release = "0.3"
reason = "用户要求确认 Linux 算法是否可用并直接完成下一步。本变更只实现麒麟内部构建、进程自检、启动门禁和运维文档；算法准确性仍待真实数据 POC，未收到更新已发布对外文档的授权。"

[[change_records]]
id = "2026-09-02-kylin-control-ack-toolchain-and-task-menu-fix"
date = "2026-09-02"
scope = "gateway_serial_validation_and_kylin_onboarding"
summary = "根据麒麟实机诊断收紧 USB 串口控制门禁：E1/E0 只接受单字节 0x01，AA、周期握手和其他应答均失败且不进入数据解析；麒麟算法构建改用 SHA-256 锁定的项目内 CMake 3.31.6，并按平台校验 Eigen 3.3.7；一键助手改为可重复的一键准备并启动及完整数字快捷菜单，同时重写现场快速上手与日志排障手册。"
external_document_action = "record_only"
change_state = "unlocked"
base_locked_release = "0.2"
target_external_release = "0.3"
reason = "现场日志确认系统 CMake 3.16.3 无法满足 SDK 3.22 最低要求，现有 Eigen 锁定与麒麟 3.3.7 不一致，并且旧策略曾把握手残片 AA 当成非空控制成功；用户要求修复并简化现场操作。变更只涉及网关内部设备校验、构建与操作流程，不修改已锁定 B 端协议。"
