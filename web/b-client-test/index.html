<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>NeuroBridge 本机可视化联调台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <h1>网关联调台</h1>
          <p class="intro">按北向协议 <span id="protocolVersion"></span> 连接网关，发送请求并查看实时数据事件。</p>
        </div>
        <div class="connection-badge" aria-live="polite">
          <span id="connectionDot" class="dot dot-off"></span>
          <span id="connectionLabel">未连接</span>
        </div>
      </header>

      <section class="connect-panel card" aria-labelledby="connectTitle">
        <div class="section-heading">
          <div>
            <h2 id="connectTitle">连接网关</h2>
            <p>页面会使用子协议 <code>neurobridge.v1</code> 建立 WebSocket 连接；不发送 Ping/Pong 或 JSON 心跳。</p>
          </div>
        </div>
        <div id="connectionRows"></div>
      </section>

      <template id="connectionRowTemplate">
        <div class="connect-row" role="group">
          <label class="field endpoint-field">
            <span></span>
            <input type="url" placeholder="ws://127.0.0.1:8765/neurobridge/v1/ws" spellcheck="false" />
          </label>
          <button class="button button-primary" type="button" data-connect>连接</button>
          <button class="button button-quiet" type="button" data-disconnect>断开</button>
        </div>
      </template>
      <section class="card algorithm-overview" aria-labelledby="algorithmTitle">
        <div class="chart-heading">
          <h2 id="algorithmTitle">实时算法数据</h2>
        </div>
        <div id="algorithmMetrics" class="source-windows"></div>
        <p class="hint">连接网关后，可在对应设备的<a href="#commandTitle">协议请求</a>中连续订阅或用 <code>getLatest</code> 查看一次。</p>
        <div id="sourceWindows" class="source-windows"></div>
      </section>

      <template id="sourceWindowTemplate">
        <section class="source-window">
          <div class="chart-heading">
            <h3 data-field="title"></h3>
            <span class="source-status" data-field="state">未连接</span>
          </div>
          <div class="visuals">
            <section class="chart-card" aria-label="脑波波形">
              <div class="chart-heading"><h4>脑波波形</h4><span data-field="waveformMeta" class="chart-meta">等待连接网关</span></div>
              <p class="hint">横轴为样本序号，纵轴为算法幅度原值。</p>
              <canvas data-field="waveform" role="img" aria-label="脑波波形图"></canvas>
            </section>
            <section class="chart-card" aria-label="频段能量">
              <div class="chart-heading"><h4>频段能量</h4><span data-field="spectrumMeta" class="chart-meta">等待连接网关</span></div>
              <p class="hint">纵轴为各频段的能量原值。</p>
              <canvas data-field="spectrum" role="img" aria-label="脑波频段能量图"></canvas>
            </section>
          </div>
          <div data-field="details" hidden>
            <dl class="status-list">
              <div><dt>设备连接</dt><dd data-field="connection">—</dd></div>
              <div><dt>采集模式</dt><dd data-field="mode">—</dd></div>
              <div><dt>佩戴状态</dt><dd data-field="wear">—</dd></div>
              <div><dt>电量</dt><dd data-field="battery">—</dd></div>
              <div><dt>受试者</dt><dd data-field="subject">—</dd></div>
              <div><dt>数据时间</dt><dd data-field="timestamp">—</dd></div>
              <div><dt>EEG 原始字节</dt><dd data-field="eegRaw">—</dd></div>
              <div><dt>HR 原始字节</dt><dd data-field="hrRaw">—</dd></div>
            </dl>
            <div class="latest-summary" data-field="summary">尚未收到网关数据。</div>
            <details class="algorithm-window">
              <summary>实时窗口详情</summary>
              <div class="algorithm-groups">
                <section class="algorithm-group" data-algorithm="eeg">
                  <div class="chart-heading"><h4>脑电算法</h4><span class="chart-meta" data-window-time>—</span></div>
                  <p class="algorithm-validity" data-window-status>等待实时窗口</p>
                  <dl class="algorithm-metrics"></dl>
                </section>
                <section class="algorithm-group" data-algorithm="hr">
                  <div class="chart-heading"><h4>心率算法</h4><span class="chart-meta" data-window-time>—</span></div>
                  <p class="algorithm-validity" data-window-status>等待实时窗口</p>
                  <dl class="algorithm-metrics"></dl>
                </section>
              </div>
            </details>
          </div>
        </section>
      </template>

      <section class="card commands" aria-labelledby="commandTitle">
        <h2 id="commandTitle">协议请求</h2>
        <div id="sourceRequests" class="source-windows"></div>
      </section>

      <template id="sourceRequestTemplate">
        <section class="source-window">
          <h3 data-request-title></h3>
          <div class="action-grid">
            <article class="action-card">
              <h4>状态与最新值</h4>
              <p>用于建连后的状态核对，或读取当前算法结果。</p>
              <div class="button-row">
                <button data-get-status class="button" type="button">getStatus</button>
                <button data-get-latest class="button" type="button">getLatest</button>
              </div>
              <fieldset class="stream-options compact" aria-label="getLatest 流选择">
                <legend>getLatest 流</legend>
                <label><input type="checkbox" name="latestStream" value="eeg" checked /> EEG</label>
                <label><input type="checkbox" name="latestStream" value="hr" checked /> HR</label>
              </fieldset>
            </article>

            <article class="action-card action-card-accent">
              <h4>连续订阅</h4>
              <p>网关确认后，将以最多每 600 ms 一组的节奏发送事件。</p>
              <fieldset class="stream-options" aria-label="订阅流选择">
                <legend>订阅流</legend>
                <label><input type="checkbox" name="subscribeStream" value="eeg" checked /> EEG 算法</label>
                <label><input type="checkbox" name="subscribeStream" value="hr" checked /> HR 算法</label>
                <label><input type="checkbox" name="subscribeStream" value="eeg.raw" /> EEG 原始字节</label>
                <label><input type="checkbox" name="subscribeStream" value="hr.raw" /> HR 原始字节</label>
                <label><input type="checkbox" name="subscribeStream" value="status" checked /> 状态</label>
              </fieldset>
              <label class="checkline"><input data-include-invalid type="checkbox" /> 同时接收无效窗口</label>
              <button data-subscribe class="button button-primary" type="button">subscribe</button>
            </article>

            <article class="action-card action-card-wide">
              <h4>取消订阅</h4>
              <p>订阅只在当前连接内有效。断开后应重新连接并重新订阅。</p>
              <label class="field">
                <span>subscriptionId</span>
                <select data-subscription disabled>
                  <option value="">暂无订阅</option>
                </select>
              </label>
              <button data-unsubscribe class="button button-danger" type="button" disabled>unsubscribe</button>
            </article>
          </div>

          <details class="custom-request">
            <summary>发送自定义请求 JSON</summary>
            <p>仅用于临时排查。内容必须符合请求根对象：<code>{protocolVersion, messageType, requestId, action, params}</code>。</p>
            <textarea spellcheck="false" aria-label="自定义 JSON 请求"></textarea>
            <button data-send-custom class="button" type="button">发送 JSON</button>
          </details>
        </section>
      </template>

      <section class="card log-card" aria-labelledby="logTitle">
        <h2 id="logTitle">协议日志</h2>
        <p>显示连接状态、发送请求和接收帧。原始字节只显示长度。</p>
        <div id="sourceLogs" class="source-windows"></div>
      </section>

      <template id="sourceLogTemplate">
        <section class="source-window">
          <div class="chart-heading">
            <h3></h3>
            <div class="button-row">
              <button class="button button-quiet" type="button" data-log-copy>复制日志</button>
              <button class="button button-quiet" type="button" data-log-clear>清空</button>
            </div>
          </div>
          <div class="log" role="log"></div>
        </section>
      </template>
    </main>
    <script src="./version.js"></script>
    <script src="./runtime-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
