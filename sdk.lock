# Source provenance for deployment verification. The Ubuntu algorithm build uses
# the vendored snapshots named below and never clones them on the target host.
[flowtime_pc_sdk]
repository = "https://github.com/Entertech/Enter-Biomodule-BLE-PC-SDK.git"
commit = "6870a6187d8cadd0759f8f5d1c5f81a90e2bacbd"
version = "1.1.6"

[affective_algorithm_sdk]
repository = "https://github.com/Entertech/AffectiveCloud-Algorithm-SDK.git"
commit = "5623c5a1a43c6b04c3907d84ba2b9b86f9b010a2"
version = "2.0.0"
vendor_path = "third_party/AffectiveCloud-Algorithm-SDK"

[affective_algorithm_sdk.build]
cmake_minimum_version = "3.22"
cxx_standard = "17"
numcpp_repository = "https://github.com/dpilger26/NumCpp.git"
numcpp_commit = "cd324a7f09ec1ec4ba2ef2d7bac4861c9a84ee47"
numcpp_version = "2.11.0"
vendor_path = "third_party/NumCpp"
macos_build_status = "source-build-and-synthetic-input-smoke-test"

[affective_algorithm_sdk.build.eigen_versions]
galaxy_kylin_v10_x86_64 = "3.3.7"
ubuntu_24_04_x86_64 = "3.4.0"
macos_poc = "5.0.1"
windows_x86_64 = "3.4.0"

# Portable, project-local Windows build inputs. Archives are verified before use.
[windows_algorithm_build]
configuration = "Release"
compiler_version = "19.1.7"

[windows_algorithm_build.packages.llvm]
version = "20250114"
filename = "llvm-mingw-20250114-ucrt-x86_64.zip"
url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20250114/llvm-mingw-20250114-ucrt-x86_64.zip"
sha256 = "9395d95c089611e6cd728c9a07219ffc5ac706e0c719833a2f7e64a706a81541"
directory = "llvm-mingw-20250114-ucrt-x86_64"

[windows_algorithm_build.packages.cmake]
version = "3.31.6"
filename = "cmake-3.31.6-windows-x86_64.zip"
url = "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip"
sha256 = "d163cd3ab4959b0a53fa8988f2ddbd2e6c501658201e6a154386bad9dbe4f836"
directory = "cmake-3.31.6-windows-x86_64"

[windows_algorithm_build.packages.ninja]
version = "1.12.1"
filename = "ninja-win.zip"
url = "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip"
sha256 = "f550fec705b6d6ff58f2db3c374c2277a37691678d6aba463adcbb129108467a"
directory = "."

[windows_algorithm_build.packages.eigen]
version = "3.4.0"
filename = "eigen-3.4.0.zip"
url = "https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.zip"
sha256 = "eba3f3d414d2f8cba2919c78ec6daab08fc71ba2ba4ae502b7e5d4d99fc02cda"
directory = "eigen-3.4.0"
