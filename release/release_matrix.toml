# Release coverage is intentionally explicit and offline. Do not discover or
# shrink this matrix from the target host during a workflow run.
schema_version = 1
default_branch = "master"
manifest_schema = "schemas/release-manifest.schema.json"
require_all_matrix_targets = false
minimum_packages_per_platform = 1

[windows]
versions = ["10-11"]
supported_os_versions = ["10", "11"]
architectures = ["x86_64"]
formats = ["exe", "msi"]
expected_package_count = 2
installer_tool = "wix-toolset-with-burn"
installer_tool_major = 7
windows_10_11_python_line = "3.11"

# The Kylin deliverable is one bootstrap package. It carries the gateway source
# and builds the runtime on the machine it is installed on, so the release does
# not prebuild a package per edition, architecture and format.
[kylin]
editions = ["v10"]
architectures = ["all"]
formats = ["deb"]
expected_package_count = 1
package_kind = "bootstrap"

[aggregate]
expected_package_count = 3
platform_archives = ["windows", "kylin"]
file_name_pattern = "neurobridge-v<applicationVersion>-<commit>.zip"

[release]
trigger = "push_master"
tag_pattern = "delivery-v<applicationVersion>-<commit>"
platform_tag_pattern = "<platform>-v<platformVersion>"
github_release_required = true
github_release_starts_as_draft = true
release_receipt_schema = "schemas/release-receipt.schema.json"
existing_tag_policy = "same_commit_only"
published_asset_policy = "exact_match_or_fail"
signing = "disabled"
actions_artifact_retention_days = 30

[build]
windows_coordinator = "windows-2022"
linux_coordinator = "ubuntu-22.04"
toolchains = "verified_offline_cache"
cross_arch_requires_target_verification = true
missing_verified_input = "blocked"

[versioning]
public_version_source = "platform_releases.<platform>.version"
delivery_version_source = "application.version"
platform_release_fields = "independent"
retry_identity = "platform_version_and_source_commit"
delivery_retry_identity = "delivery_version_and_source_commit"
same_version_master_push = "skip_when_delivery_and_platform_versions_unchanged"

[validation]
physical_verification = "pending_until_logs_uploaded"
log_directory = "validation/release"
required_log_types = ["build", "package", "install", "upgrade", "uninstall", "service", "offline", "replay_guard"]
