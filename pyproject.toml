[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurobridge"
version = "0.1.0"
description = "Headband serial/BLE to WebSocket gateway"
requires-python = ">=3.11"
dependencies = ["bleak==0.19.0", "pyserial==3.5", "websockets==12.0"]

[project.scripts]
neurobridge = "neurobridge.__main__:main"
neurobridge-dhcp-config = "neurobridge.dhcp:main"
neurobridge-network-config = "neurobridge.network_config:main"
neurobridge-serial-config = "neurobridge.serial_setup:main"

[tool.setuptools.packages.find]
include = ["neurobridge*"]

[tool.setuptools.package-data]
neurobridge = ["version_registry.toml"]
